<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Undangan Pernikahan Premium</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- LOAD GOOGLE FONTS -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;600&family=Great+Vibes&family=Cinzel:wght@400;700&family=Sacramento&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <style>
        :root {
            /* 1. FONT FAMILY */
            --font-heading: 'Playfair Display', serif; 
            --font-body: 'Montserrat', sans-serif;    
            --font-script: 'Sacramento', cursive;    
            --font-luxury: 'Cinzel', serif;          

            /* 2. UKURAN FONT */
            --size-title-cover: 3.5rem;   
            --size-script: 4.5rem;          
            --size-heading: 1.8rem;       
            --size-text: 0.85rem;         
            --size-button: 0.8rem;        

            /* 3. WARNA UTAMA */
            --primary: #8e735b;
            --primary-light: #bc9c7e;
            --secondary: #fdfaf6;
            --dark: #2c241e;
        }

        * { -webkit-tap-highlight-color: transparent; scroll-behavior: smooth; }
        body { 
            font-family: var(--font-body); 
            background: #e5e5e5; 
            color: var(--dark); 
            margin: 0; padding: 0;
            display: flex;
            justify-content: center;
            overflow-x: hidden; 
        }

        .app-container {
            width: 100%;
            max-width: 500px;
            background: var(--secondary);
            min-height: 100vh;
            position: relative;
            box-shadow: 0 0 50px rgba(0,0,0,0.1);
        }

        h1, h2, h3 { font-family: var(--font-heading); font-size: var(--size-heading); }
        .script { font-family: var(--font-script); color: var(--primary); font-size: var(--size-script); line-height: 1.2; }
        p, span, li, select, textarea, input { font-size: var(--size-text); }

        .ornament {
            position: absolute; width: 150px; pointer-events: none; z-index: 5;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.05));
            animation: float 8s ease-in-out infinite;
            opacity: 0.2;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
        }

        #cover {
            position: fixed; top: 0; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 500px; height: 100vh;
            z-index: 9999; display: flex; flex-direction: column; 
            justify-content: center; align-items: center;
            transition: all 1s cubic-bezier(0.85, 0, 0.15, 1);
            background-size: cover; background-position: center;
        }
        #cover::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,0.3), rgba(0,0,0,0.8)); z-index: -1; }
        #cover.hide { transform: translate(-50%, -100%); pointer-events: none; opacity: 0; }

        section { 
            padding: 80px 25px; 
            min-height: 100vh; 
            display: flex; flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            text-align: center;
            position: relative;
            width: 100%;
            background-size: cover;
            background-position: center;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(15px);
            border-radius: 35px; padding: 40px 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.05);
            width: 100%;
            margin-bottom: 25px;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .btn-premium {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white; padding: 14px 28px; border-radius: 50px;
            font-weight: 600; font-size: var(--size-button);
            box-shadow: 0 10px 25px rgba(142, 115, 91, 0.3);
            transition: 0.3s; display: inline-flex; align-items: center; gap: 10px;
            cursor: pointer; border: none;
        }

        .nav-dock {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 400px;
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(20px);
            padding: 8px; border-radius: 100px; display: flex; justify-content: space-around;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1); z-index: 1000;
        }

        .nav-icon { 
            width: 42px; height: 42px; display: flex; align-items: center; justify-content: center;
            color: var(--primary); font-size: 1rem; border-radius: 50%; transition: 0.3s;
        }

        .arch-frame {
            width: 200px; height: 300px;
            border-radius: 200px 200px 20px 20px;
            border: 8px solid white; box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            object-fit: cover; margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Background Music -->
        <audio id="bgMusic" loop></audio>
        <div id="music-btn" class="hidden fixed top-6 right-6 w-11 h-11 bg-white/90 backdrop-blur rounded-full flex items-center justify-center z-[10001] shadow-xl cursor-pointer" onclick="toggleMusic()">
            <i id="music-icon" class="fas fa-compact-disc fa-spin text-primary text-lg"></i>
        </div>

        <!-- 1. COVER SECTION -->
        <div id="cover">
            <div class="text-center text-white px-6">
                <p class="tracking-[8px] text-[10px] mb-4 uppercase opacity-80" data-aos="fade-down">The Wedding Invitation</p>
                <h1 id="cover-names" class="font-bold mb-8 leading-tight text-5xl">Mempelai</h1>
                <div data-aos="fade-up" data-aos-delay="500">
                    <p class="text-xs mb-2 opacity-70">Special Invitation For:</p>
                    <h3 id="guest-name" class="text-2xl font-light italic mb-10 tracking-wide">Tamu Undangan</h3>
                    <button onclick="startInvitation()" class="btn-premium">
                        <i class="fas fa-envelope-open-text"></i> Buka Undangan
                    </button>
                </div>
            </div>
        </div>

        <main id="main-content" class="opacity-0 transition-opacity duration-1000">
            
            <section id="sect-home">
                <img src="https://www.transparenttextures.com/patterns/floral-paper.png" class="ornament -top-10 -left-20">
                <div class="w-full flex flex-col items-center" data-aos="fade-up">
                    <img id="img-intro" src="" class="w-[80%] aspect-square object-cover rounded-[50px] border-[10px] border-white shadow-2xl mb-10">
                    <h2 class="script mb-6">Assalamu’alaikum</h2>
                    <p id="txt-quote" class="leading-relaxed italic px-8 opacity-70 text-sm"></p>
                </div>
            </section>

            <section id="sect-couple">
                <div class="flex flex-col items-center w-full space-y-12">
                    <div class="flex flex-col items-center text-center w-full" data-aos="fade-up">
                        <img id="img-groom" src="" class="arch-frame">
                        <h3 id="name-groom" class="font-bold text-dark mb-1"></h3>
                        <p id="parents-groom" class="text-gray-500 text-[10px] px-10 leading-relaxed"></p>
                    </div>
                    <div class="script opacity-30 text-4xl">&</div>
                    <div class="flex flex-col items-center text-center w-full" data-aos="fade-up">
                        <img id="img-bride" src="" class="arch-frame">
                        <h3 id="name-bride" class="font-bold text-dark mb-1"></h3>
                        <p id="parents-bride" class="text-gray-500 text-[10px] px-10 leading-relaxed"></p>
                    </div>
                </div>
            </section>

            <section id="sect-event">
                <h2 class="script mb-8 text-white" data-aos="fade-down" style="color: white !important;">Save The Date</h2>
                
                <div class="grid grid-cols-3 gap-4 mb-10 w-full max-w-[320px]" data-aos="zoom-in">
                    <div class="bg-white rounded-2xl p-4 text-dark"><span id="days" class="text-2xl font-bold block text-primary">00</span><p class="text-[9px] font-bold">HARI</p></div>
                    <div class="bg-white rounded-2xl p-4 text-dark"><span id="hours" class="text-2xl font-bold block">00</span><p class="text-[9px] font-bold">JAM</p></div>
                    <div class="bg-white rounded-2xl p-4 text-dark"><span id="mins" class="text-2xl font-bold block">00</span><p class="text-[9px] font-bold">MENIT</p></div>
                </div>

                <div class="glass-card text-dark" data-aos="fade-up">
                    <div class="mb-4 text-primary text-2xl"><i class="fas fa-ring"></i></div>
                    <h4 class="text-lg font-bold uppercase tracking-widest mb-2">Akad Nikah</h4>
                    <p id="akad-date" class="font-bold text-sm mb-1"></p>
                    <p id="akad-time" class="text-xs mb-4"></p>
                    <p id="akad-address" class="text-[11px] text-gray-500 italic mb-6 px-4"></p>
                    <a id="akad-link" href="#" target="_blank" class="btn-premium"><i class="fas fa-map-marker-alt"></i> Lokasi Akad</a>
                </div>

                <div class="glass-card text-dark" data-aos="fade-up" data-aos-delay="200">
                    <div class="mb-4 text-primary text-2xl"><i class="fas fa-utensils"></i></div>
                    <h4 class="text-lg font-bold uppercase tracking-widest mb-2">Resepsi</h4>
                    <p id="resepsi-date" class="font-bold text-sm mb-1"></p>
                    <p id="resepsi-time" class="text-xs mb-4"></p>
                    <p id="resepsi-address" class="text-[11px] text-gray-500 italic mb-6 px-4"></p>
                    <a id="resepsi-link" href="#" target="_blank" class="btn-premium"><i class="fas fa-map-marked-alt"></i> Lokasi Resepsi</a>
                </div>
            </section>

            <section id="sect-gift">
                <h2 class="script mb-8" data-aos="fade-up">Wedding Gift</h2>
                <div class="glass-card mb-8" data-aos="zoom-in">
                    <p id="bank-name" class="font-bold text-xs text-gray-400 mb-2"></p>
                    <h4 id="bank-acc" class="text-xl font-bold text-primary tracking-widest mb-4"></h4>
                    <p id="bank-owner" class="text-[10px] uppercase font-bold text-gray-400 mb-6"></p>
                    <button onclick="copyAccount()" class="btn-premium w-full justify-center">Salin Rekening</button>
                </div>
            </section>

            <section id="sect-rsvp">
                <h2 class="script mb-8" data-aos="fade-up">Konfirmasi</h2>
                <div class="glass-card text-left space-y-4">
                    <input type="text" id="rsvp-name" placeholder="Nama Lengkap" class="w-full p-4 rounded-2xl border-none ring-1 ring-gray-100">
                    <select id="rsvp-status" class="w-full p-4 rounded-2xl border-none ring-1 ring-gray-100">
                        <option value="Hadir">Saya Akan Hadir</option>
                        <option value="Tidak Hadir">Berhalangan</option>
                    </select>
                    <textarea id="rsvp-msg" placeholder="Pesan..." class="w-full p-4 rounded-2xl border-none ring-1 ring-gray-100 h-24"></textarea>
                    <button onclick="handleRSVP()" class="btn-premium w-full justify-center">Kirim Konfirmasi</button>
                </div>
            </section>

            <section id="sect-closing" style="min-height: 90vh; position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; background-size: cover; background-position: center;">
                <!-- Overlay Layer -->
                <div style="position: absolute; inset: 0; background: rgba(0,0,0,0.65); z-index: 10;"></div>
                
                <!-- Content Layer -->
                <div style="position: relative; z-index: 20; width: 100%; padding: 0 20px; text-align: center;" data-aos="zoom-in">
                    <h2 class="script" style="color: #ffffff; font-size: 5rem; margin-bottom: 20px; text-shadow: 0 4px 10px rgba(0,0,0,0.5);">Terima Kasih</h2>
                    <p style="color: rgba(255,255,255,0.8); font-size: 10px; letter-spacing: 5px; text-transform: uppercase; margin-bottom: 15px; font-weight: 300;">Kami yang berbahagia,</p>
                    <p id="footer-names" style="font-family: var(--font-luxury); font-weight: 700; color: #f1e4d1; letter-spacing: 6px; text-transform: uppercase; text-shadow: 0 2px 15px rgba(0,0,0,0.7); font-size: 1.4rem;"></p>
                    <div style="margin: 40px auto 0; width: 40px; h-px: 1px; background: rgba(255,255,255,0.3);"></div>
                </div>
            </section>

            <nav class="nav-dock">
                <div class="nav-icon" onclick="backToCover()"><i class="fas fa-home"></i></div>
                <div class="nav-icon" onclick="scrollToId('sect-couple')"><i class="fas fa-heart"></i></div>
                <div class="nav-icon" onclick="scrollToId('sect-event')"><i class="fas fa-calendar-alt"></i></div>
                <div class="nav-icon" onclick="scrollToId('sect-gift')"><i class="fas fa-gift"></i></div>
                <div class="nav-icon" onclick="scrollToId('sect-rsvp')"><i class="fas fa-paper-plane"></i></div>
            </nav>
        </main>
    </div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        const CONFIG = {
            mempelai: {
                pria: {
                    nama: "Iqbal Ramadhan, S.T.",
                    panggilan: "Iqbal",
                    ortu: "Putra dari Bapak H. Ahmad & Ibu Hj. Siti",
                    foto: "https://images.unsplash.com/photo-1537367663815-62cd166db296?w=600"
                },
                wanita: {
                    nama: "Iis Permatasari, S.Pd.",
                    panggilan: "Iis",
                    ortu: "Putri dari Bapak Bambang & Ibu Retno",
                    foto: "https://images.unsplash.com/photo-1594463750939-ebb28c3f7f75?w=600"
                }
            },
            event: {
                // Countdown menghitung mundur ke Target Date (Resepsi)
                targetDate: "July 20, 2025 11:00:00",
                akad: {
                    tanggal: "Minggu, 20 Juli 2025",
                    jam: "08:00 - 10:00 WIB",
                    alamat: "Masjid Raya Baiturrahman, Yogyakarta",
                    linkMaps: "https://maps.google.com"
                },
                resepsi: {
                    tanggal: "Minggu, 20 Juli 2025",
                    jam: "11:00 - Selesai",
                    alamat: "Gedung Serbaguna Indah, Yogyakarta",
                    linkMaps: "https://maps.google.com"
                }
            },
            media: {
                fotoCover: "https://images.unsplash.com/photo-1519741497674-611481863552?w=1200",
                fotoIntro: "https://images.unsplash.com/photo-1511285560929-80b456fea0bc?w=1000",
                fotoClosing: "https://images.unsplash.com/photo-1515934751635-c81c6bc9a2d8?w=1200",
                linkMusik: "https://www.bensound.com/bensound-music/bensound-memories.mp3"
            },
            kado: { bank: "BCA", noRek: "123 456 7890", pemilik: "IQBAL RAMADHAN", wa: "6281234567890" },
            quote: `"Dan di antara tanda-tanda kekuasaan-Nya ialah Dia menciptakan untukmu isteri-isteri dari jenismu sendiri, supaya kamu cenderung dan merasa tenteram kepadanya." (QS. Ar-Rum: 21)`,
            backgrounds: {
                home: "#fdfaf6",               
                couple: "#f9f7f4",             
                event: "#2c241e",              
                gift: "#ffffff", 
                rsvp: "#fdfaf6",               
                closing: "url('https://images.unsplash.com/photo-1515934751635-c81c6bc9a2d8?w=1200')" 
            }
        };

        function init() {
            AOS.init({ duration: 1000, once: false });

            const p = CONFIG.mempelai.pria;
            const w = CONFIG.mempelai.wanita;
            
            // Set Mempelai Texts
            document.getElementById('cover-names').innerText = `${p.panggilan} & ${w.panggilan}`;
            document.getElementById('footer-names').innerText = `${p.panggilan} & ${w.panggilan}`;
            document.getElementById('name-groom').innerText = p.nama;
            document.getElementById('parents-groom').innerText = p.ortu;
            document.getElementById('name-bride').innerText = w.nama;
            document.getElementById('parents-bride').innerText = w.ortu;
            
            // Set Event Data
            document.getElementById('akad-date').innerText = CONFIG.event.akad.tanggal;
            document.getElementById('akad-time').innerText = CONFIG.event.akad.jam;
            document.getElementById('akad-address').innerText = CONFIG.event.akad.alamat;
            document.getElementById('akad-link').href = CONFIG.event.akad.linkMaps;
            document.getElementById('resepsi-date').innerText = CONFIG.event.resepsi.tanggal;
            document.getElementById('resepsi-time').innerText = CONFIG.event.resepsi.jam;
            document.getElementById('resepsi-address').innerText = CONFIG.event.resepsi.alamat;
            document.getElementById('resepsi-link').href = CONFIG.event.resepsi.linkMaps;
            
            // Other Configs
            document.getElementById('bank-name').innerText = CONFIG.kado.bank;
            document.getElementById('bank-acc').innerText = CONFIG.kado.noRek;
            document.getElementById('bank-owner').innerText = CONFIG.kado.pemilik;
            document.getElementById('txt-quote').innerText = CONFIG.quote;
            
            // Photos and Backgrounds
            document.getElementById('cover').style.backgroundImage = `url('${CONFIG.media.fotoCover}')`;
            document.getElementById('img-intro').src = CONFIG.media.fotoIntro;
            document.getElementById('img-groom').src = p.foto;
            document.getElementById('img-bride').src = w.foto;
            document.getElementById('sect-closing').style.backgroundImage = CONFIG.backgrounds.closing;
            
            document.getElementById('sect-home').style.background = CONFIG.backgrounds.home;
            document.getElementById('sect-couple').style.background = CONFIG.backgrounds.couple;
            document.getElementById('sect-event').style.background = CONFIG.backgrounds.event;
            document.getElementById('sect-gift').style.background = CONFIG.backgrounds.gift;
            document.getElementById('sect-rsvp').style.background = CONFIG.backgrounds.rsvp;

            // Guest Name
            const params = new URLSearchParams(window.location.search);
            const to = params.get('to');
            if(to) document.getElementById('guest-name').innerText = to;

            startCountdown();
        }

        function startInvitation() {
            document.getElementById('cover').classList.add('hide');
            document.getElementById('main-content').classList.replace('opacity-0', 'opacity-100');
            document.body.style.overflow = "auto";
            const music = document.getElementById('bgMusic');
            if(music.src === "" || music.paused) {
                music.src = CONFIG.media.linkMusik;
                music.play().catch(() => {});
            }
            document.getElementById('music-btn').classList.remove('hidden');
        }

        function backToCover() {
            document.getElementById('cover').classList.remove('hide');
            document.body.style.overflow = "hidden";
            window.scrollTo({ top: 0, behavior: 'instant' });
        }

        function toggleMusic() {
            const m = document.getElementById('bgMusic');
            const icon = document.getElementById('music-icon');
            if(m.paused) { m.play(); icon.classList.add('fa-spin'); }
            else { m.pause(); icon.classList.remove('fa-spin'); }
        }

        function startCountdown() {
            const target = new Date(CONFIG.event.targetDate).getTime();
            setInterval(() => {
                const now = new Date().getTime();
                const diff = target - now;
                if(diff < 0) return;
                document.getElementById('days').innerText = String(Math.floor(diff / (1000 * 60 * 60 * 24))).padStart(2, '0');
                document.getElementById('hours').innerText = String(Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60))).padStart(2, '0');
                document.getElementById('mins').innerText = String(Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60))).padStart(2, '0');
            }, 1000);
        }

        function copyAccount() {
            const acc = CONFIG.kado.noRek.replace(/\s/g, '');
            const el = document.createElement('textarea');
            el.value = acc;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            const btn = event.currentTarget;
            btn.innerText = "Tersalin!";
            setTimeout(() => btn.innerText = "Salin Rekening", 2000);
        }

        function handleRSVP() {
            const n = document.getElementById('rsvp-name').value;
            const s = document.getElementById('rsvp-status').value;
            const m = document.getElementById('rsvp-msg').value;
            if(!n || !m) return;
            const text = `Halo, saya *${n}*%0AStatus: *${s}*%0A%0A"${m}"`;
            window.open(`https://wa.me/${CONFIG.kado.wa}?text=${text}`, '_blank');
        }

        function scrollToId(id) {
            document.getElementById(id).scrollIntoView({ behavior: 'smooth' });
        }

        window.onload = init;
    </script>
</body>
</html>
