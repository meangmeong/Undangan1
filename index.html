<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Undangan Pernikahan - Iqbal & Iis</title>
    
    <!-- Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;600&family=Great+Vibes&family=Sacramento&family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <style>
        :root {
            /* Dashbord Font & Ukuran */
            --font-heading: 'Playfair Display', serif;
            --font-script: 'Great Vibes', cursive;
            --font-body: 'Montserrat', sans-serif;
            --font-accent: 'Cinzel', serif;
            --font-elegant: 'Sacramento', cursive;

            /* Warna Utama */
            --primary: #8e735b;
            --primary-light: #bc9c7e;
            --secondary: #fdfaf6;
            --dark: #2c241e;

            /* Ukuran Font Dashboard */
            --size-title-cover: 3.5rem;
            --size-text: 0.875rem;
        }

        * { -webkit-tap-highlight-color: transparent; }
        body { font-family: var(--font-body); background: var(--secondary); color: var(--dark); overflow-x: hidden; margin: 0; }
        
        .app-container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            min-height: 100vh;
            position: relative;
            box-shadow: 0 0 50px rgba(0,0,0,0.1);
        }

        h1, h2, h3 { font-family: var(--font-heading); }
        .script { font-family: var(--font-script); color: var(--primary); font-size: 3rem; }
        .font-elegant { font-family: var(--font-elegant); }
        .font-accent { font-family: var(--font-accent); }

        /* --- ORNAMEN MELAYANG --- */
        .ornament {
            position: absolute; width: 150px; opacity: 0.2; pointer-events: none; z-index: 1;
            animation: floating 6s ease-in-out infinite;
        }
        @keyframes floating {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(10px, -20px) rotate(5deg); }
        }

        /* --- COVER SECTION --- */
        #cover {
            position: fixed; inset: 0; z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: transform 1.2s cubic-bezier(0.85, 0, 0.15, 1);
            background-size: cover; background-position: center;
            max-width: 500px; margin: 0 auto;
        }
        #cover.hide { transform: translateY(-100%); }
        #cover::after { content: ""; position: absolute; inset: 0; background: rgba(0,0,0,0.4); z-index: -1; }

        /* --- SECTION BASE --- */
        section { 
            position: relative; padding: 80px 20px; min-height: 100vh; 
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; overflow: hidden;
        }

        .arch-frame {
            width: 80%; max-width: 300px; aspect-ratio: 2/3;
            border-radius: 500px 500px 20px 20px;
            border: 8px solid white; object-fit: cover;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 40px; padding: 30px;
            width: 100%; box-shadow: 0 15px 35px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        .btn-premium {
            background: var(--primary); color: white; padding: 14px 30px;
            border-radius: 50px; font-weight: 600; display: inline-flex;
            align-items: center; gap: 10px; transition: 0.3s;
            box-shadow: 0 10px 20px rgba(142, 115, 91, 0.3);
            font-size: 0.9rem;
        }

        /* --- NAV DOCK --- */
        .nav-dock {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(15px);
            padding: 10px 20px; border-radius: 100px; display: flex; gap: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); z-index: 1000;
            width: fit-content; border: 1px solid rgba(0,0,0,0.05);
        }
        .nav-icon { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; color: var(--primary); font-size: 1.1rem; }

        /* --- CLOSING SECTION --- */
        #sect-closing {
            position: relative; color: white; background-size: cover; background-position: center;
        }
        .closing-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.6); z-index: 1; }
        .closing-content { position: relative; z-index: 2; width: 100%; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- BG Music -->
        <audio id="bgMusic" loop></audio>
        <div id="music-btn" class="hidden fixed top-5 right-5 w-12 h-12 bg-white/90 backdrop-blur rounded-full flex items-center justify-center z-[10001] shadow-lg cursor-pointer" onclick="toggleMusic()">
            <i class="fas fa-music text-primary text-lg"></i>
        </div>

        <!-- Cover -->
        <div id="cover">
            <div class="text-center text-white px-6">
                <p class="tracking-[5px] text-xs mb-4 uppercase opacity-80" data-aos="fade-down">The Wedding of</p>
                <h1 id="cover-names" class="text-5xl mb-10 font-bold" data-aos="zoom-in" data-aos-duration="1500" style="font-family: var(--font-heading);"></h1>
                <div data-aos="fade-up" data-aos-delay="800">
                    <p class="text-sm mb-2 opacity-70">Kepada Yth:</p>
                    <h3 id="guest-name" class="text-2xl font-light italic mb-10">Tamu Undangan</h3>
                    <button onclick="startInvitation()" class="btn-premium">
                        <i class="fas fa-envelope-open-text"></i> Buka Undangan
                    </button>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <main id="main-content" class="opacity-0 transition-opacity duration-1000">
            
            <section id="sect-home">
                <img src="https://www.transparenttextures.com/patterns/floral-paper.png" class="ornament -top-10 -left-20">
                <div class="w-full flex flex-col items-center">
                    <img id="img-intro" src="" class="w-[80%] aspect-square object-cover rounded-[50px] border-[10px] border-white shadow-2xl mb-10" data-aos="zoom-in" data-aos-duration="1500">
                    <h2 class="script mb-6" data-aos="fade-up">Assalamu’alaikum</h2>
                    <p id="txt-quote" class="leading-relaxed italic px-8 opacity-70 text-sm" data-aos="fade-up" data-aos-delay="300"></p>
                </div>
            </section>

            <section id="sect-couple">
                <div class="flex flex-col items-center w-full space-y-12">
                    <div class="flex flex-col items-center text-center w-full" data-aos="fade-right">
                        <img id="img-groom" src="" class="arch-frame shadow-2xl mb-6">
                        <h3 id="name-groom" class="font-bold text-dark mb-1 text-xl"></h3>
                        <p id="parents-groom" class="text-gray-500 text-[10px] px-10 leading-relaxed"></p>
                    </div>
                    
                    <div class="script opacity-30 text-4xl" data-aos="zoom-in">&</div>
                    
                    <div class="flex flex-col items-center text-center w-full" data-aos="fade-left">
                        <img id="img-bride" src="" class="arch-frame shadow-2xl mb-6">
                        <h3 id="name-bride" class="font-bold text-dark mb-1 text-xl"></h3>
                        <p id="parents-bride" class="text-gray-500 text-[10px] px-10 leading-relaxed"></p>
                    </div>
                </div>
            </section>

            <section id="sect-event">
                <h2 class="script mb-8 text-white" data-aos="fade-down" style="color: white !important;">Save The Date</h2>
                
                <div class="grid grid-cols-3 gap-4 mb-10 w-full max-w-[320px]">
                    <div class="bg-white rounded-2xl p-4 text-dark shadow-sm" data-aos="flip-left" data-aos-delay="100">
                        <span id="days" class="text-2xl font-bold block text-primary">00</span>
                        <p class="text-[9px] font-bold">HARI</p>
                    </div>
                    <div class="bg-white rounded-2xl p-4 text-dark shadow-sm" data-aos="flip-left" data-aos-delay="200">
                        <span id="hours" class="text-2xl font-bold block">00</span>
                        <p class="text-[9px] font-bold">JAM</p>
                    </div>
                    <div class="bg-white rounded-2xl p-4 text-dark shadow-sm" data-aos="flip-left" data-aos-delay="300">
                        <span id="mins" class="text-2xl font-bold block">00</span>
                        <p class="text-[9px] font-bold">MENIT</p>
                    </div>
                </div>

                <div class="glass-card text-dark" data-aos="fade-up">
                    <div class="mb-4 text-primary text-2xl"><i class="fas fa-ring"></i></div>
                    <h4 class="text-lg font-bold uppercase tracking-widest mb-2">Akad Nikah</h4>
                    <p id="akad-date" class="font-bold text-sm mb-1"></p>
                    <p id="akad-time" class="text-xs mb-4"></p>
                    <p id="akad-address" class="text-[11px] text-gray-500 italic mb-6 px-4"></p>
                    <a id="akad-link" href="#" target="_blank" class="btn-premium"><i class="fas fa-map-marker-alt"></i> Lokasi Akad</a>
                </div>

                <div class="glass-card text-dark" data-aos="fade-up">
                    <div class="mb-4 text-primary text-2xl"><i class="fas fa-utensils"></i></div>
                    <h4 class="text-lg font-bold uppercase tracking-widest mb-2">Resepsi</h4>
                    <p id="resepsi-date" class="font-bold text-sm mb-1"></p>
                    <p id="resepsi-time" class="text-xs mb-4"></p>
                    <p id="resepsi-address" class="text-[11px] text-gray-500 italic mb-6 px-4"></p>
                    <a id="resepsi-link" href="#" target="_blank" class="btn-premium"><i class="fas fa-map-marked-alt"></i> Lokasi Resepsi</a>
                </div>
            </section>

            <section id="sect-gift">
                <h2 class="script mb-8" data-aos="fade-up">Wedding Gift</h2>
                <div class="glass-card mb-8" data-aos="zoom-in">
                    <p class="text-[10px] text-gray-400 mb-2 uppercase tracking-widest">Bank Central Asia</p>
                    <h4 id="bank-acc" class="text-xl font-bold text-primary tracking-widest mb-2"></h4>
                    <p id="bank-owner" class="text-[10px] uppercase font-bold text-gray-400 mb-6"></p>
                    <button onclick="copyAccount()" class="btn-premium w-full justify-center">Salin Rekening</button>
                </div>
            </section>

            <section id="sect-rsvp">
                <h2 class="script mb-8" data-aos="fade-up">Konfirmasi</h2>
                <div class="glass-card space-y-4" data-aos="fade-up">
                    <input type="text" id="rsvp-name" placeholder="Nama Lengkap" class="w-full p-4 rounded-2xl bg-gray-50 border-none ring-1 ring-gray-100 text-sm">
                    <select id="rsvp-status" class="w-full p-4 rounded-2xl bg-gray-50 border-none ring-1 ring-gray-100 text-sm">
                        <option value="Hadir">Saya Akan Hadir</option>
                        <option value="Tidak Hadir">Berhalangan Hadir</option>
                    </select>
                    <textarea id="rsvp-msg" placeholder="Ucapan & Doa" class="w-full p-4 rounded-2xl bg-gray-50 border-none ring-1 ring-gray-100 text-sm h-32"></textarea>
                    <button onclick="handleRSVP()" class="btn-premium w-full justify-center">Kirim Via WhatsApp</button>
                </div>
            </section>

            <section id="sect-closing">
                <div class="closing-overlay"></div>
                <div class="closing-content">
                    <h2 class="font-elegant text-5xl mb-8" data-aos="fade-up">Terima Kasih</h2>
                    <p class="text-[10px] tracking-[4px] opacity-70 mb-10" data-aos="fade-up">Atas doa dan restu Anda</p>
                    <h3 id="footer-names" class="font-accent text-2xl tracking-[8px] text-[#f1e4d1]" data-aos="zoom-in" data-aos-duration="1500"></h3>
                </div>
            </section>

            <nav class="nav-dock">
                <div class="nav-icon" onclick="backToCover()"><i class="fas fa-home"></i></div>
                <div class="nav-icon" onclick="scrollToId('sect-home')"><i class="fas fa-heart"></i></div>
                <div class="nav-icon" onclick="scrollToId('sect-event')"><i class="fas fa-calendar-alt"></i></div>
                <div class="nav-icon" onclick="scrollToId('sect-gift')"><i class="fas fa-gift"></i></div>
                <div class="nav-icon" onclick="scrollToId('sect-rsvp')"><i class="fas fa-comment-dots"></i></div>
            </nav>
        </main>
    </div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        // --- DASHBOARD CONFIGURATION ---
        const CONFIG = {
            mempelai: {
                pria: "Iqbal Ramadhan, S.T.",
                priaPanggilan: "Iqbal",
                ortuPria: "Putra dari Bapak H. Ahmad & Ibu Hj. Siti",
                wanita: "Iis Permatasari, S.Pd.",
                wanitaPanggilan: "Iis",
                ortuWanita: "Putri dari Bapak Bambang & Ibu Retno",
                whatsapp: "6281234567890" // Tanpa + atau spasi
            },
            event: {
                akadTanggal: "Minggu, 20 Juli 2025",
                akadWaktu: "08:00 - 10:00 WIB",
                akadAlamat: "Masjid Agung Kotagede, Yogyakarta",
                akadMaps: "https://maps.google.com",
                resepsiTanggal: "Minggu, 20 Juli 2025",
                resepsiWaktu: "11:00 - 14:00 WIB",
                resepsiAlamat: "Gedung Serbaguna Indah, Yogyakarta",
                resepsiMaps: "https://maps.google.com",
                targetCountdown: "July 20, 2025 11:00:00" // Waktu Resepsi
            },
            media: {
                fotoCover: "https://images.unsplash.com/photo-1519741497674-611481863552?w=1200",
                fotoIntro: "https://images.unsplash.com/photo-1583939003579-730e3918a45a?w=800",
                fotoPria: "https://images.unsplash.com/photo-1537367663815-62cd166db296?w=600",
                fotoWanita: "https://images.unsplash.com/photo-1594463750939-ebb28c3f7f75?w=600",
                fotoClosing: "https://images.unsplash.com/photo-1515934751635-c81c6bc9a2d8?w=1200",
                linkMusik: "https://www.bensound.com/bensound-music/bensound-memories.mp3"
            },
            backgrounds: {
                home: "#fdfaf6",
                couple: "#ffffff",
                event: "linear-gradient(to bottom, #2c241e, #8e735b)",
                gift: "#fdfaf6",
                rsvp: "#ffffff"
            },
            gift: {
                bank: "BCA",
                noRek: "123 456 7890",
                atasNama: "IQBAL RAMADHAN"
            }
        };

        function initApp() {
            AOS.init({ duration: 1000, once: false });

            // Fill UI
            const pairName = `${CONFIG.mempelai.priaPanggilan} & ${CONFIG.mempelai.wanitaPanggilan}`;
            document.getElementById('cover-names').innerText = pairName;
            document.getElementById('footer-names').innerText = pairName;
            
            document.getElementById('img-intro').src = CONFIG.media.fotoIntro;
            document.getElementById('img-groom').src = CONFIG.media.fotoPria;
            document.getElementById('img-bride').src = CONFIG.media.fotoWanita;
            document.getElementById('cover').style.backgroundImage = `url('${CONFIG.media.fotoCover}')`;
            document.getElementById('sect-closing').style.backgroundImage = `url('${CONFIG.media.fotoClosing}')`;

            document.getElementById('name-groom').innerText = CONFIG.mempelai.pria;
            document.getElementById('parents-groom').innerText = CONFIG.mempelai.ortuPria;
            document.getElementById('name-bride').innerText = CONFIG.mempelai.wanita;
            document.getElementById('parents-bride').innerText = CONFIG.mempelai.ortuWanita;

            document.getElementById('akad-date').innerText = CONFIG.event.akadTanggal;
            document.getElementById('akad-time').innerText = CONFIG.event.akadWaktu;
            document.getElementById('akad-address').innerText = CONFIG.event.akadAlamat;
            document.getElementById('akad-link').href = CONFIG.event.akadMaps;

            document.getElementById('resepsi-date').innerText = CONFIG.event.resepsiTanggal;
            document.getElementById('resepsi-time').innerText = CONFIG.event.resepsiWaktu;
            document.getElementById('resepsi-address').innerText = CONFIG.event.resepsiAlamat;
            document.getElementById('resepsi-link').href = CONFIG.event.resepsiMaps;

            document.getElementById('bank-acc').innerText = CONFIG.gift.noRek;
            document.getElementById('bank-owner').innerText = CONFIG.gift.atasNama;

            document.getElementById('txt-quote').innerText = "Dan di antara tanda-tanda kekuasaan-Nya ialah Dia menciptakan untukmu isteri-isteri dari jenismu sendiri, supaya kamu cenderung dan merasa tenteram kepadanya.";

            // Apply Backgrounds
            document.getElementById('sect-home').style.background = CONFIG.backgrounds.home;
            document.getElementById('sect-couple').style.background = CONFIG.backgrounds.couple;
            document.getElementById('sect-event').style.background = CONFIG.backgrounds.event;
            document.getElementById('sect-gift').style.background = CONFIG.backgrounds.gift;
            document.getElementById('sect-rsvp').style.background = CONFIG.backgrounds.rsvp;

            // Handle URL Guest
            const params = new URLSearchParams(window.location.search);
            const to = params.get('to');
            if(to) document.getElementById('guest-name').innerText = to;

            startCountdown();
        }

        function startInvitation() {
            document.getElementById('cover').classList.add('hide');
            document.getElementById('main-content').classList.replace('opacity-0', 'opacity-100');
            document.body.style.overflow = "auto";
            
            setTimeout(() => { AOS.refresh(); }, 200);

            const music = document.getElementById('bgMusic');
            music.src = CONFIG.media.linkMusik;
            music.play().catch(e => console.log("Autoplay blocked"));
            document.getElementById('music-btn').classList.remove('hidden');
        }

        function toggleMusic() {
            const music = document.getElementById('bgMusic');
            if(music.paused) music.play();
            else music.pause();
        }

        function startCountdown() {
            const target = new Date(CONFIG.event.targetCountdown).getTime();
            setInterval(() => {
                const now = new Date().getTime();
                const diff = target - now;
                if(diff < 0) return;
                document.getElementById('days').innerText = String(Math.floor(diff / (1000 * 60 * 60 * 24))).padStart(2, '0');
                document.getElementById('hours').innerText = String(Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60))).padStart(2, '0');
                document.getElementById('mins').innerText = String(Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60))).padStart(2, '0');
            }, 1000);
        }

        function copyAccount() {
            const no = CONFIG.gift.noRek.replace(/\s/g, '');
            navigator.clipboard.writeText(no);
            alert("Nomor rekening berhasil disalin!");
        }

        function handleRSVP() {
            const name = document.getElementById('rsvp-name').value;
            const status = document.getElementById('rsvp-status').value;
            const msg = document.getElementById('rsvp-msg').value;
            if(!name || !msg) return alert("Mohon isi nama dan pesan.");
            
            const text = `Konfirmasi RSVP Undangan%0ANama: ${name}%0AStatus: ${status}%0APesan: ${msg}`;
            window.open(`https://wa.me/${CONFIG.mempelai.whatsapp}?text=${text}`, '_blank');
        }

        function scrollToId(id) {
            document.getElementById(id).scrollIntoView({ behavior: 'smooth' });
        }

        function backToCover() {
            document.getElementById('cover').classList.remove('hide');
            document.body.style.overflow = "hidden";
            window.scrollTo(0, 0);
        }

        window.onload = initApp;
    </script>
</body>
</html>
